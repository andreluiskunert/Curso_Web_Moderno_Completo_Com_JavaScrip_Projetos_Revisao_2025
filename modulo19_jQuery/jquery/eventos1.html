<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Eventos #01</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src='js/jquery.js'></script>
    <style>
        input {
            font-size: 2em;
        }
    </style>
</head>

<body class='conteudo exercicio'>
    <h1>Eventos #01</h1>
    <div id='posicao'></div>
    <div id='cliques'>Cliques: 0</div>
    <input type="text" placeholder="Cor de Background">

    <script>
        // ... Quarta-feira, 11/03/2026_1ªParte 
        // Obs.: tive reiniciar o not... 
        function mostrarPosicaoMouse(e){
            $('#posicao').html(`x:${e.clientX} y:${e.clientY}`)
        }
        $('body').on('mousemove', mostrarPosicaoMouse)
        $('#posicao').mouseover(e => {
             $('body').off('mousemove', mostrarPosicaoMouse)
        })
          $('#posicao').mouseleave(e => {
             $('body').mousemove (mostrarPosicaoMouse)
        })
        let cliques = 0 
         $('body').click(e => {
            $('#cliques').html(`Cliques: ${++cliques}`)
         })
        const backgroundOriginal = $('body').css('background-color')  // manter cor orginal do sistema
        //  fazer o restante amanha de noite
        // Quinta-feira,12/03/2026_De noite
        $('input').keyup(function(e){
            // console.log(e.target.value)
            const valor = $(this).val()
            // console.log(valor)
            if(valor.match(/#[\da-fA-F]{3,6}/)){
                $('body').css('background-color', valor)
            } else {
                $('body').css('background-color', backgroundOriginal)
            }
        })
        
    </script>
</body>
