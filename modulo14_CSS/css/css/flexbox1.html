<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Flexbox #01</title>
    <link rel="stylesheet" href="css/tag.css">
    <style>
        /* ... */  
        div{
            border: solid 5px dodgerblue;
            font-size: 40px;
            margin: 5px;
        }
        .big{
            font-size: 1.5em;
        }
        .flex-container {
            display: flex;
            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row-reverse;
            flex-direction: row;
            width: 50%;
            
            flex-wrap: wrap;
            flex-wrap: wrap-reverse;
            flex-flow: row wrap;
            height: 200px;
            flex-flow: column-reverse-wrap;
            justify-content: flex-start;
            justify-content: flex-end;
            justify-content: center;
            justify-content: space-around;
            flex-direction: row-reverse;
            justify-content: space-between;
            /* Cross Axis */
            height: 400px;
            align-items: stretch;
            align-items: start;
            align-items: flex-start;
            align-items: flex-end;
            align-items: center;
            /* mais de uma linha */
            align-content: flex-start;
            align-content: flex-end;
            align-content: center;
            align-content: space-around;
            align-content: space-between;

        }
     /* ... */

    marquee{
        background-color: aqua;
        font-weight: 300;
        font-size: 2rem;
        font-family: Arial, Helvetica, sans-serif
    }
   
    .rodape{
        font-weight: 100;
        font-size: 1.5rem;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }
    h3{
        font: optional;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 200;
        background-color: azure;

    }

    </style>
</head>
<marquee> Revisão Curso Web Moderno Completo com JavaScript + Projetos
 </marquee>

<body>

        <div class="tag nolabel">1</div>
        <div class="tag nolabel">2</div>
        <div class="tag nolabel big">3</div>
        <div class="tag nolabel">4</div>
        <div class="tag nolabel">5</div>
        <div class="tag nolabel">6</div>
        <div class="tag nolabel">7</div>
        <div class="tag nolabel">8</div>
        <div class="tag nolabel">9</div>
        <div class="tag nolabel">10</div>
    </div>
    <script src="js/tag.js"></script>
</body>
