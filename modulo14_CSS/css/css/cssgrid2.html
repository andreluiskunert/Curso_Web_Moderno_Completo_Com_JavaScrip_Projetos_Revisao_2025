<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CSS Grid #02</title>
    <style>
        html,
        body {
            margin: 20px;
            height: calc(100% - 40px);
            background-color: lightgray;
        }
        body{
            display: grid;
            grid-template-columns: 
            [inicio] 1fr
            [metade-1 meio-1] 1fr
            [metade-3 meio-2] 1fr[fim];
            grid-template-rows: repeat(3, 1fr);
            grid-column-gap: 20px;
            grid-row-gap: 20px;
            grid-gap: 50px 20px;
            grid-gap: 10px;
        }
        .d1{
            grid-column-start: metade-2;
            grid-column-start: fim;
            grid-row: 1 /span 2;
            /* row-start column-start row-end column-end */
            grid-area: 1 / meio-1 / span 3 / fim ;
        }
        div {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: solid 5px dodgerblue;
            background: #fff;
        }  marquee{
        background-color: aqua;
        font-weight: 300;
        font-size: 2rem;
        font-family: Arial, Helvetica, sans-serif
    }
   
    .rodape{
        font-weight: 100;
        font-size: 1.5rem;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }
    h3{
        font: optional;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 200;
        background-color: azure;

    }

    </style>
</head>
<header>
  <marquee> Revisão Curso Web Moderno Completo com JavaScript + Projetos
 </marquee>  
</header>

<body>
    <div class="d1">1</div>
    <div class="d2">2</div>
    <div class="d3">3</div>
</body>
<footer>
    <div1 class="rodape">
        <h3>reponsavel Andre Luis Kunert_Técnico em Informática e Analistta de TI e Sistemas/Futuro Dev Full Stack_2025
        </h3>
    </div1>
    <marquee> Revisão Curso Web Moderno Completo com JavaScript + Projetos </marquee>
</footer>

</html>
