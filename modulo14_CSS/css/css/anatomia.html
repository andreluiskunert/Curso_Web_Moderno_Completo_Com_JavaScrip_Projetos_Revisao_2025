<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Anatomia CSS</title>
    <style>
        /* 
         sexta-feira,03/10/2025
         de noite
        */
        .seletor{
            color: #fff;
            font-size: 30px;
            background-color: rgb(34, 153, 189);
            text-align: center;
            /* multiplos valores  */
            border: solid 5px navy; /* shorthand property */
            font-family: Arial, Helvetica, sans-serif;
            /* Funções */
            width: calc(100% - 40px);
        }
        /* Usar pseudo-classe */
        .seletor:hover{
            background-color: orangered;
        }
        /* Uar pseudo-elemento */
        .seletor::first-letter{
            font-size: 60px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="seletor">Conteúdo</div>
</body>

</html>
